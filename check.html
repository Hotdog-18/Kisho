<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KISHO 接続チェック</title>
<style>
  body { font: 16px/1.7 "Hiragino Mincho ProN","Yu Mincho",serif; background: #e9eef1; color: #1d2b3a; margin: 0; padding: 24px 16px; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; } p { margin: 6px 0; color: #3d5266; }
  button { font: inherit; padding: 10px 22px; border: 0; border-radius: 10px; background: #17808f; color: #fff; cursor: pointer; margin: 12px 0; }
  ul { list-style: none; padding: 0; } li { background: #f8fafb; border: 1px solid #cdd6dc; border-radius: 10px; padding: 10px 14px; margin: 8px 0; }
  .ok b { color: #1c7a3d; } .ng b { color: #b8321c; } .wait b { color: #7a8794; } small { display: block; color: #55677a; }
  a { color: #17808f; }
</style></head>
<body><main>
  <h1>KISHO 接続チェック</h1>
  <p>友達とオンラインで対局するための設定(Supabase)が、うまくつながっているか調べます。</p>
  <button id="go">チェックする</button>
  <ul id="out"></ul>
  <p><a href="./">← KISHO にもどる</a></p>
</main>
<script src="js/config.js"></script>
<script src="js/net.js"></script>
<script>
const out = document.getElementById('out');
function row(t) { const li = document.createElement('li'); li.className = 'wait'; li.innerHTML = '<b>…</b> ' + t; out.appendChild(li); return li; }
function done(li, ok, t, why) { li.className = ok ? 'ok' : 'ng'; li.innerHTML = '<b>' + (ok ? '○' : '×') + '</b> ' + t + (why ? '<small>' + why + '</small>' : ''); return ok; }
const timeout = (p, ms) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error('時間切れ')), ms))]);
document.getElementById('go').onclick = async () => {
  out.innerHTML = ''; const N = window.KishoNet;
  let li = row('設定ファイルに URL とキーが入っている');
  if (!done(li, N.configured, '設定ファイルに URL とキーが入っている', N.configured ? '' : 'js/config.js が空です。')) return;
  li = row('通信将棋の保存(データベース)に書いて、読める');
  try {
    const key = 'check' + Date.now(), val = { ping: Date.now() };
    const w = await timeout(N._rpc('kisho_put_game', { p_room: key, p_state: val }), 10000);
    if (!w.ok) throw new Error('書き込みが断られました (' + w.status + ') ' + (await w.text()).slice(0, 120));
    const r = await timeout(N._rpc('kisho_get_game', { p_room: key }), 10000);
    const got = r.ok ? await r.json() : null;
    done(li, got && got.ping === val.ping, '通信将棋の保存(データベース)に書いて、読める', got && got.ping === val.ping ? '' : '読み出した内容が合いません (' + r.status + ')。SQL Editor で schema.sql を Run したか確認してください。');
  } catch (e) { done(li, false, '通信将棋の保存(データベース)に書いて、読める', String(e.message || e)); }
  li = row('リアルタイム対局の通信(2台ぶんを模擬)');
  try {
    const room = 'check-' + Math.random().toString(36).slice(2);
    const a = await timeout(N.connect(room), 20000), b = await timeout(N.connect(room), 20000);
    if (a.fallback || b.fallback) throw new Error('Supabase につながらず、同じブラウザ内モードになりました。URL とキー、ネット接続を確認してください。');
    const got = new Promise((res) => { b.transport.onmessage = res; });
    await new Promise((r) => setTimeout(r, 800));
    a.transport.send({ t: 'ping' });
    await timeout(got, 6000);
    a.transport.close(); b.transport.close();
    done(li, true, 'リアルタイム対局の通信(2台ぶんを模擬)', 'メッセージが相手に届きました。');
  } catch (e) { done(li, false, 'リアルタイム対局の通信(2台ぶんを模擬)', String(e.message || e)); }
  row('').remove();
  const all = [...out.children].every((x) => x.className === 'ok');
  const fin = document.createElement('li'); fin.className = all ? 'ok' : 'ng'; fin.innerHTML = all ? '<b>全部OK!</b> 友達と対局できます。' : '<b>×があります。</b> 上の説明をスクリーンショットで教えてください。'; out.appendChild(fin);
};
</script></body></html>
