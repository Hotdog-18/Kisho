<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KISHO 棋匠</title>
<meta name="description" content="合言葉の部屋で友達と指せる将棋サイト。AIとの練習、棋譜の振り返り、KRSレーティング付き。">
<meta name="theme-color" content="#243b53">
<script>try{var t=(JSON.parse(localStorage.getItem('kisho.settings')||'{}')).theme;if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;800&family=Yuji+Syuku&family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="sealRough" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
    </filter>
    <linearGradient id="pcShade" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".30"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".20"/>
    </linearGradient>
    <linearGradient id="tileWood" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#f7e2ae"/><stop offset=".55" stop-color="#ebc884"/><stop offset="1" stop-color="#d9ac62"/>
    </linearGradient>
    <filter id="tileGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.22 0.012" numOctaves="3" seed="11"/>
      <feColorMatrix values="0 0 0 0 .40  0 0 0 0 .24  0 0 0 0 .07  3.2 0 0 0 -1.35"/>
    </filter>
    <clipPath id="tileFace"><path d="M42 6.2 69.6 21.2 78 94H6L14.4 21.2Z"/></clipPath>
    <symbol id="seal" viewBox="0 0 100 100">
      <g filter="url(#sealRough)">
        <rect x="5" y="5" width="90" height="90" rx="6" fill="#c43d22"/>
        <rect x="10.5" y="10.5" width="79" height="79" rx="3" fill="none" stroke="#eef1f3" stroke-width="1.4" opacity=".85"/>
        <text x="50" y="46" text-anchor="middle" dominant-baseline="central" font-family="'Yuji Syuku','Yu Mincho','Noto Serif CJK JP',serif" font-size="66" fill="#eef1f3">匠</text>
      </g>
    </symbol>
  </defs>
</svg>


<div class="washi" aria-hidden="true">
  <i class="washi-sun"></i>
  <svg class="washi-wave" width="100%" height="100%">
    <defs><pattern id="seigaiha" width="40" height="20" patternUnits="userSpaceOnUse"><g fill="var(--page)" stroke="currentColor" stroke-width="1"><circle cx="20" cy="-10" r="20"/><circle cx="20" cy="-10" r="15"/><circle cx="20" cy="-10" r="10"/><circle cx="20" cy="-10" r="5"/><circle cx="0" cy="0" r="20"/><circle cx="0" cy="0" r="15"/><circle cx="0" cy="0" r="10"/><circle cx="0" cy="0" r="5"/><circle cx="40" cy="0" r="20"/><circle cx="40" cy="0" r="15"/><circle cx="40" cy="0" r="10"/><circle cx="40" cy="0" r="5"/><circle cx="20" cy="10" r="20"/><circle cx="20" cy="10" r="15"/><circle cx="20" cy="10" r="10"/><circle cx="20" cy="10" r="5"/><circle cx="0" cy="20" r="20"/><circle cx="0" cy="20" r="15"/><circle cx="0" cy="20" r="10"/><circle cx="0" cy="20" r="5"/><circle cx="40" cy="20" r="20"/><circle cx="40" cy="20" r="15"/><circle cx="40" cy="20" r="10"/><circle cx="40" cy="20" r="5"/><circle cx="20" cy="30" r="20"/><circle cx="20" cy="30" r="15"/><circle cx="20" cy="30" r="10"/><circle cx="20" cy="30" r="5"/></g></pattern></defs>
    <rect width="100%" height="100%" fill="url(#seigaiha)"/>
  </svg>
</div>

<header class="top">
  <button class="logo" id="logoBtn" aria-label="ホームへ">
    <svg class="logo-seal" viewBox="0 0 100 100" aria-hidden="true"><use href="#seal"/></svg><span class="logo-k">棋匠</span><span class="logo-e">KISHO</span>
  </button>
  <div class="top-right">
    <button class="me-chip" id="meChip" title="プロフィールとKRS"></button>
    <button class="icon-btn" id="settingsBtn" aria-label="設定">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
  </div>
</header>

<main>
  <!-- ホーム -->
  <section id="home" class="screen">
    <div class="hero">
      <h1 class="hero-logo" aria-label="棋匠 KISHO"><svg class="hero-seal" viewBox="0 0 100 100" aria-hidden="true"><use href="#seal"/></svg><span class="hero-e">KISHO</span></h1>
      <p class="hero-sub">友達と指す将棋。合言葉を伝えるだけで、すぐ始められる。</p>
    </div>

    <div class="entries">
      <button class="tile" data-go="ai"><svg class="tile-bg" viewBox="0 0 84 103" preserveAspectRatio="none" aria-hidden="true"><path d="M42 1.5 73 18.5 82.5 98.5H1.5L11 18.5Z" transform="translate(0 3)" fill="#5a3f14" stroke="#5a3f14" stroke-width="3" stroke-linejoin="round"/><path d="M42 1.5 73 18.5 82.5 98.5H1.5L11 18.5Z" fill="var(--tile-edge)" stroke="var(--tile-edge)" stroke-width="3" stroke-linejoin="round"/><path d="M42 6.2 69.6 21.2 78 94H6L14.4 21.2Z" fill="url(#tileWood)" stroke="url(#tileWood)" stroke-width="1.6" stroke-linejoin="round"/><g clip-path="url(#tileFace)"><rect x="0" y="0" width="84" height="100" filter="url(#tileGrain)" opacity=".5"/></g><path d="M42 6.2 69.6 21.2 78 94H6L14.4 21.2Z" fill="url(#pcShade)" stroke="url(#pcShade)" stroke-width="1.6" stroke-linejoin="round"/><path d="M14.4 21.2 42 6.2 69.6 21.2" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/><path d="M69.6 21.2 78 94H6" fill="none" stroke="#3a2406" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity=".22"/></svg><span class="tile-g">能</span><b>AIと指す</b><small>10段階の強さ</small></button>
      <button class="tile" data-go="friend"><svg class="tile-bg" viewBox="0 0 84 103" preserveAspectRatio="none" aria-hidden="true"><path d="M42 1.5 73 18.5 82.5 98.5H1.5L11 18.5Z" transform="translate(0 3)" fill="#5a3f14" stroke="#5a3f14" stroke-width="3" stroke-linejoin="round"/><path d="M42 1.5 73 18.5 82.5 98.5H1.5L11 18.5Z" fill="var(--tile-edge)" stroke="var(--tile-edge)" stroke-width="3" stroke-linejoin="round"/><path d="M42 6.2 69.6 21.2 78 94H6L14.4 21.2Z" fill="url(#tileWood)" stroke="url(#tileWood)" stroke-width="1.6" stroke-linejoin="round"/><g clip-path="url(#tileFace)"><rect x="0" y="0" width="84" height="100" filter="url(#tileGrain)" opacity=".5"/></g><path d="M42 6.2 69.6 21.2 78 94H6L14.4 21.2Z" fill="url(#pcShade)" stroke="url(#pcShade)" stroke-width="1.6" stroke-linejoin="round"/><path d="M14.4 21.2 42 6.2 69.6 21.2" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/><path d="M69.6 21.2 78 94H6" fill="none" stroke="#3a2406" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity=".22"/></svg><span class="tile-g">友</span><b>友達と指す</b><small>合言葉の部屋</small></button>
      <button class="tile" data-go="records"><svg class="tile-bg" viewBox="0 0 84 103" preserveAspectRatio="none" aria-hidden="true"><path d="M42 1.5 73 18.5 82.5 98.5H1.5L11 18.5Z" transform="translate(0 3)" fill="#5a3f14" stroke="#5a3f14" stroke-width="3" stroke-linejoin="round"/><path d="M42 1.5 73 18.5 82.5 98.5H1.5L11 18.5Z" fill="var(--tile-edge)" stroke="var(--tile-edge)" stroke-width="3" stroke-linejoin="round"/><path d="M42 6.2 69.6 21.2 78 94H6L14.4 21.2Z" fill="url(#tileWood)" stroke="url(#tileWood)" stroke-width="1.6" stroke-linejoin="round"/><g clip-path="url(#tileFace)"><rect x="0" y="0" width="84" height="100" filter="url(#tileGrain)" opacity=".5"/></g><path d="M42 6.2 69.6 21.2 78 94H6L14.4 21.2Z" fill="url(#pcShade)" stroke="url(#pcShade)" stroke-width="1.6" stroke-linejoin="round"/><path d="M14.4 21.2 42 6.2 69.6 21.2" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/><path d="M69.6 21.2 78 94H6" fill="none" stroke="#3a2406" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity=".22"/></svg><span class="tile-g">譜</span><b>棋譜</b><small>再生と振り返り</small></button>
    </div>

    <section class="card saved-card" id="savedCard" hidden>
      <h2>中断中の対局</h2>
      <ul class="rec-list" id="savedList"></ul>
    </section>

    <div class="home-grid">
      <section class="card krs-card" id="krsCard"></section>
      <section class="card" id="recordsCard">
        <h2>最近の対局</h2>
        <ul class="rec-list" id="recList"></ul>
      </section>
    </div>
  </section>

  <!-- 対局・棋譜 -->
  <section id="game" class="screen" hidden>
    <div class="stage" id="stage">
      <div class="pcard" id="cardTop"></div>
      <div class="hand" id="handTop" aria-label="相手の持ち駒"></div>
      <div class="board-wrap" id="boardWrap">
        <div class="coords coords-f" id="coordF"></div>
        <div class="coords coords-r" id="coordR"></div>
        <div class="board" id="board" role="grid" aria-label="将棋盤"></div>
        <svg class="arrows" id="arrows" viewBox="0 0 9 9" aria-hidden="true"></svg>
      </div>
      <div class="hand" id="handBot" aria-label="自分の持ち駒"></div>
      <div class="pcard" id="cardBot"></div>
    </div>

    <aside class="panel">
      <div class="tabs" role="tablist" id="tabs">
        <button role="tab" data-tab="moves" aria-selected="true">棋譜</button>
        <button role="tab" data-tab="chat" id="tabChat" hidden>チャット</button>
        <button role="tab" data-tab="review" id="tabReview" hidden>振り返り</button>
      </div>
      <div class="tabpane" id="paneMoves"><ol class="moves" id="moveList"></ol></div>
      <div class="tabpane" id="paneChat" hidden>
        <ul class="chat-log" id="chatLog"></ul>
        <form class="chat-form" id="chatForm"><input id="chatInput" maxlength="120" placeholder="メッセージ" autocomplete="off"><button class="btn" type="submit">送る</button></form>
      </div>
      <div class="tabpane" id="paneReview" hidden></div>
      <div class="navbtns" id="navBtns">
        <button class="icon-btn" data-nav="first" aria-label="最初へ">⏮</button>
        <button class="icon-btn" data-nav="prev" aria-label="一手戻る">◀</button>
        <button class="icon-btn" data-nav="next" aria-label="一手進む">▶</button>
        <button class="icon-btn" data-nav="last" aria-label="最後へ">⏭</button>
      </div>
      <div class="actions" id="actions"></div>
    </aside>
  </section>
</main>

<!-- ダイアログ -->
<dialog id="dlgAi">
  <form method="dialog" class="dlg-body" id="aiForm">
    <h2>AIと指す</h2>
    <fieldset><legend>強さ</legend><div class="level-list" id="levelList"></div></fieldset>
    <div class="row2">
      <label>あなたの手番<select id="aiColor"><option value="0">先手</option><option value="1">後手</option><option value="r">ランダム</option></select></label>
      <label>持ち時間<select id="aiTc"></select></label>
    </div>
    <div class="dlg-actions"><button class="btn ghost" value="cancel" formnovalidate>やめる</button><button class="btn primary" value="ok" id="aiStart">対局開始</button></div>
  </form>
</dialog>

<dialog id="dlgFriend">
  <form method="dialog" class="dlg-body" id="friendForm">
    <h2>友達と指す</h2>
    <div class="seg" id="friendMode">
      <button type="button" data-fm="room" aria-pressed="true">合言葉の部屋</button>
      <button type="button" data-fm="local" aria-pressed="false">同じ画面で</button>
    </div>
    <div id="roomFields">
      <label>あなたの名前<input id="fName" maxlength="12" autocomplete="nickname"></label>
      <label>合言葉<input id="fPass" maxlength="40" placeholder="友達と同じ言葉を入れる" autocomplete="off"></label>
      <div class="row2">
        <label>対局のしかた<select id="fStyle"><option value="live">リアルタイム</option><option value="async">通信将棋 (好きな時に1手ずつ)</option></select></label>
        <label>持ち時間<select id="fTc"></select></label>
      </div>
      <label id="fMailRow" hidden>通知メール (任意)<input id="fMail" type="email" placeholder="相手が指したら知らせるメール" autocomplete="email"></label>
      <p class="note" id="netNote"></p>
    </div>
    <div id="localFields" hidden>
      <div class="row2">
        <label>先手の名前<input id="lBlack" maxlength="12" value="先手"></label>
        <label>後手の名前<input id="lWhite" maxlength="12" value="後手"></label>
      </div>
      <label>持ち時間<select id="lTc"></select></label>
      <p class="note">1台の画面を交代で使います。KRSは変わりません。</p>
    </div>
    <div class="dlg-actions"><button class="btn ghost" value="cancel" formnovalidate>やめる</button><button class="btn primary" value="ok" id="friendStart">はじめる</button></div>
  </form>
</dialog>

<dialog id="dlgSettings">
  <form method="dialog" class="dlg-body">
    <h2>設定</h2>
    <label>名前<input id="sName" maxlength="12"></label>
    <fieldset><legend>画面</legend><div class="seg seg3" id="themeMode" role="group" aria-label="画面"><button type="button" data-tm="auto">機種に合わせる</button><button type="button" data-tm="light">ライト</button><button type="button" data-tm="dark">ダーク</button></div></fieldset>
    <fieldset><legend>駒のデザイン</legend><div class="swatches" id="pieceSets"></div></fieldset>
    <fieldset><legend>盤のデザイン</legend><div class="swatches" id="boardThemes"></div></fieldset>
    <div class="checks">
      <label class="chk"><input type="checkbox" id="sHints"> 動かせるマスを表示</label>
      <label class="chk"><input type="checkbox" id="sCoords"> 筋と段の数字を表示</label>
      <label class="chk"><input type="checkbox" id="sSound"> 駒音</label>
      <label class="chk"><input type="checkbox" id="sFlip"> 後手のとき盤を自動で反転</label>
    </div>
    <details class="danger"><summary>データの削除</summary>
      <p class="note">このブラウザに保存している KRS・棋譜・設定をすべて消します。</p>
      <button type="button" class="btn warn" id="resetAll">すべて削除</button>
    </details>
    <div class="dlg-actions"><button class="btn primary" value="ok">閉じる</button></div>
  </form>
</dialog>

<dialog id="dlgPromote">
  <form method="dialog" class="dlg-body small">
    <h2>成りますか？</h2>
    <div class="promo-choices" id="promoChoices"></div>
  </form>
</dialog>

<dialog id="dlgResult">
  <form method="dialog" class="dlg-body" id="resultBody"></form>
</dialog>

<dialog id="dlgAbout">
  <form method="dialog" class="dlg-body" id="aboutBody"></form>
</dialog>

<dialog id="dlgConfirm">
  <form method="dialog" class="dlg-body small">
    <p id="confirmMsg" style="margin:0;font-size:17px"></p>
    <p id="confirmHint" class="note" style="margin:10px 0 0" hidden></p>
    <div class="dlg-actions" style="justify-content:center"><button class="btn ghost" value="no" id="confirmNo">やめる</button><button class="btn primary" value="yes" id="confirmOk">OK</button><button class="btn primary" value="extra" id="confirmExtra" hidden></button></div>
  </form>
</dialog>

<dialog id="dlgWait">
  <form method="dialog" class="dlg-body" id="waitBody"></form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/shogi.js"></script>
<script src="js/ai.js"></script>
<script src="js/krs.js"></script>
<script src="js/themes.js"></script>
<script src="js/sound.js"></script>
<script src="js/net.js"></script>
<script src="js/app.js"></script>
<script src="js/room.js"></script>
</body>
</html>
